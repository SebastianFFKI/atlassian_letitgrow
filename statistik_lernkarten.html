<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistik Lernkarten</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface-hover: #20243a;
    --border: #2a2e42;
    --border-accent: #3b6fd4;
    --text-primary: #e8eaf0;
    --text-secondary: #8a8fa8;
    --text-muted: #555a72;
    --accent: #4a7fe8;
    --accent-bg: #1a2540;
    --accent-text: #7aaeff;
    --warning: #e8a84a;
    --warning-bg: #2a1f0e;
    --tag-colors: #3b6fd4;
    --radius: 14px;
  }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2.5rem 1rem;
  }

  .wrap {
    width: 100%;
    max-width: 560px;
  }

  header {
    margin-bottom: 2rem;
  }

  h1 {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: .35rem;
  }

  .subtitle {
    font-size: 22px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .controls-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: .75rem;
  }

  .prog-label {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .btn-shuffle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }

  .btn-shuffle:hover {
    background: var(--surface-hover);
    color: var(--text-primary);
    border-color: #3a3e58;
  }

  .btn-shuffle svg { width: 14px; height: 14px; stroke: currentColor; }

  .progress-bar {
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 1.5rem;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width .35s ease;
  }

  .scene {
    width: 100%;
    height: 280px;
    perspective: 1200px;
    cursor: pointer;
    margin-bottom: 1.25rem;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .42s cubic-bezier(.4,0,.2,1);
  }

  .card-inner.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 2rem 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .card-back { transform: rotateY(180deg); }

  .card-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent-text);
    background: var(--accent-bg);
    border: 1px solid var(--border-accent);
    border-radius: 6px;
    padding: 3px 9px;
    margin-bottom: 1.1rem;
    align-self: flex-start;
  }

  .card-question {
    font-size: 20px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.4;
    flex: 1;
    display: flex;
    align-items: center;
  }

  .card-hint {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 1.25rem;
    letter-spacing: .03em;
  }

  .answer-tag {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: .85rem;
  }

  .card-answer {
    font-size: 15px;
    color: var(--text-primary);
    line-height: 1.65;
    flex: 1;
  }

  .card-warning {
    font-size: 13px;
    color: var(--warning);
    background: var(--warning-bg);
    border-radius: 8px;
    padding: .6rem .85rem;
    margin-top: .85rem;
    line-height: 1.5;
    display: none;
  }

  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .btn-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }

  .btn-nav:hover {
    background: var(--surface-hover);
    color: var(--text-primary);
    border-color: #3a3e58;
  }

  .btn-nav.primary {
    background: var(--accent-bg);
    border-color: var(--border-accent);
    color: var(--accent-text);
  }

  .btn-nav.primary:hover {
    background: #1e2e50;
    color: #9cbeff;
  }

  .btn-nav svg { width: 16px; height: 16px; stroke: currentColor; flex-shrink: 0; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Lernkarten</h1>
    <div class="subtitle">Statistik &amp; Datenanalyse</div>
  </header>

  <div class="controls-top">
    <span class="prog-label" id="prog-label">Karte 1 von 15</span>
    <button class="btn-shuffle" onclick="shuffle()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
      Mischen
    </button>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="prog-fill" style="width:6.67%"></div>
  </div>

  <div class="scene" id="scene" onclick="flip()">
    <div class="card-inner" id="card-inner">
      <div class="card-face card-front">
        <div class="card-tag" id="card-tag"></div>
        <div class="card-question" id="card-question"></div>
        <div class="card-hint">Klicken zum Aufdecken</div>
      </div>
      <div class="card-face card-back">
        <div class="answer-tag">Antwort</div>
        <div class="card-answer" id="card-answer"></div>
        <div class="card-warning" id="card-warning"></div>
      </div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn-nav" onclick="prev()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Zurück
    </button>
    <button class="btn-nav primary" onclick="next()">
      Weiter
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

</div>

<script>
const cards = [
  { tag: "Lagemaß",        q: "Was ist der Mittelwert?",                              a: "Alle Werte addieren, durch die Anzahl teilen. Funktioniert gut solange keine extremen Einzelwerte dabei sind – ein einziger Ausreißer zieht ihn stark nach oben oder unten.", w: null },
  { tag: "Lagemaß",        q: "Was ist der Median?",                                  a: "Alle Werte der Größe nach sortieren, den mittleren herausgreifen. Extreme Werte ändern ihn kaum – deshalb ehrlicher als der Mittelwert bei verzerrten Daten.", w: "Bei ungerader Anzahl: der mittlere Wert. Bei gerader: Durchschnitt der beiden mittleren." },
  { tag: "Lagemaß",        q: "Was ist der Modus?",                                   a: "Der Wert, der am häufigsten vorkommt. Kein Rechnen, nur zählen. Nützlich bei Kategorien – z.B. welches Produkt am meisten zurückgegeben wird.", w: null },
  { tag: "Streumaß",       q: "Was ist die Spannweite?",                              a: "Größter minus kleinster Wert. Zeigt sofort, wie weit die Daten auseinanderliegen. Schnell berechnet, aber ein einziger Extremwert macht sie unbrauchbar.", w: null },
  { tag: "Streumaß",       q: "Was ist die Varianz?",                                 a: "Misst, wie stark die Werte um den Mittelwert streuen – aber das Ergebnis ist quadriert und dadurch schwer direkt lesbar. Hauptsächlich ein Zwischenschritt zur Standardabweichung.", w: null },
  { tag: "Streumaß",       q: "Was ist die Standardabweichung?",                      a: "Die Wurzel der Varianz – dadurch wieder in der ursprünglichen Einheit (€, Tage, kg). Zeigt, wie weit Werte typischerweise vom Mittelwert abweichen.", w: null },
  { tag: "Ausreißer",      q: "Was ist ein Outlier?",                                 a: "Ein Wert, der weit außerhalb des normalen Bereichs liegt. Er verfälscht den Mittelwert stark, lässt den Median aber kalt.", w: "Nicht automatisch löschen – erst prüfen ob Messfehler oder echter Wert." },
  { tag: "Methode",        q: "Was ist EDA?",                                         a: "Explorative Datenanalyse: der erste Schritt vor jeder Auswertung. Daten anschauen bevor man Schlüsse zieht – Ausreißer finden, Verteilung verstehen, Muster erkennen.", w: null },
  { tag: "Zusammenhang",   q: "Was ist Korrelation?",                                 a: "Zeigt, wie stark zwei Größen zusammenhängen. Der Wert liegt zwischen −1 (entgegengesetzt) und +1 (gleichläufig), 0 bedeutet kein Zusammenhang.", w: "Ein Zusammenhang beweist keine Ursache – das ist der häufigste Denkfehler." },
  { tag: "Zusammenhang",   q: "Pearson, Spearman, Kovarianz – was ist der Unterschied?", a: "Pearson: für stetige, gleichmäßig verteilte Daten (Gewicht, Länge). Spearman: für Rangfolgen oder schief verteilte Daten (Schulnoten). Kovarianz: nur für eine erste grobe Richtungseinschätzung – kein normierter Wert.", w: null },
  { tag: "Datenvorbereitung", q: "Was ist Datenimputation?",                          a: "Fehlende Werte werden geschätzt statt die ganze Datenzeile zu löschen – per Mittelwert, Median oder KI. Erhält die Datenmenge, kann aber Ungenauigkeiten einführen.", w: null },
  { tag: "Datenvorbereitung", q: "Was ist Normalisierung?",                           a: "Verschiedene Größen (z.B. Tage und Euro) auf eine einheitliche Skala bringen, damit sie direkt vergleichbar werden. Üblich: Werte zwischen 0 und 1 skalieren.", w: null },
  { tag: "Methode",        q: "Was ist ein Hypothesentest?",                          a: "Prüft statistisch, ob ein beobachteter Unterschied echt ist oder nur zufällig auftritt. Das Ergebnis ist entweder signifikant oder nicht – kein Mittelweg.", w: null },
  { tag: "Visualisierung", q: "Was zeigt ein Histogramm?",                            a: "Wie häufig verschiedene Wertebereiche vorkommen. Gut um zu erkennen, ob Daten gleichmäßig verteilt, verschoben oder in mehreren Gruppen gebündelt sind.", w: "Sieht aus wie ein Balkendiagramm, zeigt aber Häufigkeiten – keine Kategorien." },
  { tag: "Visualisierung", q: "Was zeigt ein Streudiagramm?",                         a: "Jeder Punkt steht für ein Datenpaar (X, Y). Zeigt auf einen Blick, ob zwischen zwei Größen ein Zusammenhang besteht – und ob er linear ist oder nicht.", w: null }
];

let order = [...Array(cards.length).keys()];
let idx = 0;
let isFlipped = false;

function render() {
  const c = cards[order[idx]];
  const ci = document.getElementById('card-inner');
  const doRender = () => {
    document.getElementById('card-tag').textContent = c.tag;
    document.getElementById('card-question').textContent = c.q;
    document.getElementById('card-answer').textContent = c.a;
    const w = document.getElementById('card-warning');
    if (c.w) { w.textContent = '⚠ ' + c.w; w.style.display = 'block'; }
    else { w.style.display = 'none'; }
    document.getElementById('prog-label').textContent = 'Karte ' + (idx + 1) + ' von ' + cards.length;
    document.getElementById('prog-fill').style.width = ((idx + 1) / cards.length * 100).toFixed(2) + '%';
  };
  if (isFlipped) {
    ci.classList.remove('flipped');
    isFlipped = false;
    setTimeout(doRender, 220);
  } else {
    doRender();
  }
}

function flip() {
  const ci = document.getElementById('card-inner');
  isFlipped = !isFlipped;
  if (isFlipped) ci.classList.add('flipped');
  else ci.classList.remove('flipped');
}

function next() {
  idx = (idx + 1) % cards.length;
  render();
}

function prev() {
  idx = (idx - 1 + cards.length) % cards.length;
  render();
}

function shuffle() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  idx = 0;
  render();
}

render();
</script>
</body>
</html>
